# GitHub Actions CI pipeline for File-Manager-Pro.
#
# Test-once policy (one full suite per finished task, never per commit):
#   - push to any branch except main -> fast build/lint/unit gate only, so a
#     long feature run is never spent on intermediate commits (in-flight runs
#     are cancelled by concurrency as soon as a newer push lands).
#   - pull_request -> full quality gate: build + instrumented emulator suite
#     (and real-emulator screenshots when the PR carries the 'screenshots'
#     label). This is the ONE heavy run per merge.
#   - main is excluded from push CI: main only ever receives merges whose
#     exact tree already passed the full suite on the pull request.
#
# The main branch is protected: merges require this pipeline to pass.

name: CI

on:
  push:
    branches-ignore: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android Build, Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Run Android Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble release APK (R8 gate)
        # Unsigned on PRs (keystore envs only exist on tagged releases); the
        # point is to run the R8 shrinker against every change. (#22)
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true # artifact service blips must not fail the quality gate
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  # Instrumented Espresso suite on an emulator (#22). GitHub-hosted runners
  # have no nested virtualization, so this boots without KVM acceleration and
  # is slower than a local run; keep the suite small and permission-free.
  instrumented-tests:
    name: Instrumented tests (API 29 emulator)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-29" "build-tools;34.0.0" "platform-tools" "emulator"
          sdkmanager --install "system-images;android-29;default;x86_64"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048
          disable-animations: true
          # Software-emulated (no KVM on hosted runners): give the boot more time.
          script: ./gradlew --no-daemon connectedDebugAndroidTest

  # Real-emulator screenshots for the README (not mockups). Runs only when a
  # pull request carries the 'screenshots' label (added before a capture is
  # wanted), is never a required check, and uploads the PNGs so they can be
  # committed to docs/screenshots.
  app-screenshots:
    name: App screenshots (API 29 emulator)
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'screenshots')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true # capture must never block merges
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-29" "build-tools;34.0.0" "platform-tools" "emulator"
          sdkmanager --install "system-images;android-29;default;x86_64"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Run capture instrumentation on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell settings put system screen_off_timeout 600000 || true
            adb shell mkdir -p /sdcard/Download
            for f in seed-files/*; do adb push "$f" /sdcard/Download/; done
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.inayatechlab.filemanagerpro.ScreenshotCaptureTest -Pandroid.testInstrumentationRunnerArguments.screenshots=true
            # Pull while the emulator is still alive inside this action step.
            adb logcat -d -s Screenshots
            mkdir -p artifacts
            timeout 60 adb pull /sdcard/Pictures/FMP-Screenshots ./artifacts/ || true
            ls -laR artifacts || true

      - name: Pull screenshots (fallback)
        run: |
          mkdir -p artifacts
          for i in 1 2 3; do
            timeout 20 adb wait-for-device || true
            state=$(timeout 10 adb get-state 2>/dev/null || echo offline)
            echo "adb state: $state"
            if [ "$state" = "device" ] && timeout 60 adb pull /sdcard/Android/data/com.inayatechlab.filemanagerpro/files/screenshots ./artifacts/; then
              echo "PULL OK"
              break
            fi
            sleep 10
          done
          ls -laR artifacts || true

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshots
          path: artifacts
          if-no-files-found: error
